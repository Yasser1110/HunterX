[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hunterx"
version = "0.2.0"
description = "Authorized bug-hunting / attack-surface monitoring framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HunterX contributors" }]
keywords = ["security", "bug-bounty", "recon", "scope", "monitoring"]
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0",
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hunterx = "hunterx.cli:main"

[tool.setuptools.packages.find]
include = ["hunterx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]